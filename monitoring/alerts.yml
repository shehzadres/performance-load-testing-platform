groups:
  - name: performance-lab
    rules:
      - alert: ApiHighServerErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[2m])) / clamp_min(sum(rate(http_requests_total[2m])), 0.001) > 0.02
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "API server error rate above 2 percent"}
      - alert: ApiHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "API p95 latency above 500ms"}
